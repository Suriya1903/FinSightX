{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "finsightx.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: "prometheus"

        static_configs:
          - targets:
              - "localhost:9090"


      - job_name: "api-gateway"

        metrics_path: /metrics

        static_configs:
          - targets:
              - "api-gateway:8000"


      - job_name: "fraud-service"

        metrics_path: /metrics

        static_configs:
          - targets:
              - "fraud-service:8004"
{{- end }}