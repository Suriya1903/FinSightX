apiVersion: v1
kind: ConfigMap
metadata:
  name: finsightx-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "finsightx.labels" . | nindent 4 }}
data:
  APP_NAME: "FinSightX"
  APP_ENV: "development"
  APP_DEBUG: "true"

  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.global.kafka.bootstrapServers | quote }}

  REDIS_HOST: {{ .Values.global.redis.host | quote }}
  REDIS_PORT: {{ .Values.global.redis.port | quote }}

  POSTGRES_HOST: {{ .Values.global.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.global.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.global.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.global.postgres.username | quote }}

  ML_SERVICE_PORT: "8008"
  ML_SERVICE_URL: {{ .Values.global.ml.serviceUrl | quote }}
  MODEL_VERSION: {{ .Values.global.ml.modelVersion | quote }}

  MINIO_ENDPOINT: {{ .Values.global.minio.endpoint | quote }}
  MINIO_BUCKET: {{ .Values.global.minio.bucket | quote }}
  MINIO_SECURE: "false"

  JWT_ALGORITHM: {{ .Values.global.jwt.algorithm | quote }}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.global.jwt.accessTokenExpireMinutes | quote }}

  MLFLOW_HOST: "mlflow"
  MLFLOW_PORT: "5000"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"

  API_GATEWAY_PORT: "8000"
  AUTH_SERVICE_PORT: "8001"
  CUSTOMER_SERVICE_PORT: "8002"
  TRANSACTION_SERVICE_PORT: "8003"
  FRAUD_SERVICE_PORT: "8004"
  NOTIFICATION_SERVICE_PORT: "8005"
  AUDIT_SERVICE_PORT: "8006"
  ANALYTICS_SERVICE_PORT: "8007"