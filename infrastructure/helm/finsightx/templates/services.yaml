apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    app: api-gateway
    {{- include "finsightx.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.apiGateway.type }}
  selector:
    app: api-gateway
  ports:
    - name: http
      port: {{ .Values.services.apiGateway.port }}
      targetPort: 8000
      protocol: TCP
      nodePort: {{ .Values.services.apiGateway.nodePort }}

