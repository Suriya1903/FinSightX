  namespace: {{ .Values.namespace.name }}
  labels:
    app: audit-service
    {{- include "finsightx.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: audit-service
  ports:
    - name: http
      port: {{ .Values.services.auditService.port }}
      targetPort: 8006
      protocol: TCP

