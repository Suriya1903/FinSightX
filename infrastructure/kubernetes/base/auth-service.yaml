apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: finsightx
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: finsightx/auth-service:k8s
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: finsightx-config
                  key: APP_NAME

            - name: DATABASE_URL
              value: "postgresql+psycopg://finsightx:change_me@postgres:5432/finsightx"

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: finsightx-secrets
                  key: JWT_SECRET_KEY

            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: finsightx-config
                  key: JWT_ALGORITHM

            - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: finsightx-config
                  key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES

          readinessProbe:
            httpGet:
              path: /health
              port: 8001

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8001

            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: finsightx

spec:
  type: ClusterIP

  selector:
    app: auth-service

  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP