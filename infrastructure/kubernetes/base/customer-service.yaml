apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: finsightx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: finsightx/customer-service:k8s
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8009
              protocol: TCP

          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://finsightx:change_me@postgres:5432/finsightx"

          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: finsightx
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
    - name: http
      port: 8009
      targetPort: 8009
      protocol: TCP