apiVersion: v1
kind: ConfigMap
metadata:
  name: finsightx-config
  namespace: finsightx
data:
  APP_NAME: "FinSightX"
  APP_ENV: "development"
  APP_DEBUG: "true"

  POSTGRES_DB: "finsightx"
  POSTGRES_USER: "finsightx"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "finsightx-data"
  MINIO_SECURE: "false"

  MLFLOW_HOST: "mlflow"
  MLFLOW_PORT: "5000"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"

  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"

  API_GATEWAY_PORT: "8000"
  AUTH_SERVICE_PORT: "8001"
  CUSTOMER_SERVICE_PORT: "8002"
  TRANSACTION_SERVICE_PORT: "8003"
  FRAUD_SERVICE_PORT: "8004"
  NOTIFICATION_SERVICE_PORT: "8005"
  AUDIT_SERVICE_PORT: "8006"
  ANALYTICS_SERVICE_PORT: "8007"
  ML_SERVICE_PORT: "8008"

  ML_SERVICE_URL: "http://ml-service:8008"
  MODEL_VERSION: "7D"