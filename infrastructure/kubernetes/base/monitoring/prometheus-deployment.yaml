apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: finsightx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:

    metadata:
      labels:
        app: prometheus

    spec:

      containers:

        - name: prometheus

          image: prom/prometheus:v3.5.0

          imagePullPolicy: IfNotPresent

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"

          ports:

            - name: http
              containerPort: 9090
              protocol: TCP

          volumeMounts:

            - name: config
              mountPath: /etc/prometheus

            - name: data
              mountPath: /prometheus

          readinessProbe:

            httpGet:
              path: /-/ready
              port: 9090

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:

            httpGet:
              path: /-/healthy
              port: 9090

            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:

        - name: config

          configMap:
            name: prometheus-config

        - name: data

          emptyDir: {}