apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: finsightx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: finsightx/ml-service:k8s
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8008
              protocol: TCP

          env:
            - name: MODEL_PATH
              value: "/app/models/fraud_random_forest.joblib"

            - name: MODEL_VERSION
              valueFrom:
                configMapKeyRef:
                  name: finsightx-config
                  key: MODEL_VERSION

          readinessProbe:
            httpGet:
              path: /ready
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: finsightx
spec:
  type: ClusterIP
  selector:
    app: ml-service
  ports:
    - name: http
      port: 8008
      targetPort: 8008
      protocol: TCP